<!doctype html><html lang="zh-Hant-TW" data-theme="night" data-variant="a"><head><meta charset="utf-8">
<title>游標預覽</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="variants.css">
<style>
body{padding:40px;font-family:var(--sans)}
.grid{display:grid;grid-template-columns:repeat(6,140px);gap:18px}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;border:1px solid var(--line);border-radius:16px}
.cell .big svg{width:96px;height:96px}.cell .small svg{width:40px;height:40px}
.row{display:flex;gap:12px;align-items:end}
h2{font-size:22px;margin:32px 0 16px}
.split{display:flex;gap:28px;align-items:center}
.split .h{width:96px;height:96px;overflow:hidden;position:relative}
.split svg{width:96px;height:96px}
</style></head><body>
<script>window.SG_CURSOR_PREVIEW=true</script><script src="cursor.js"></script>
<h2>平常：每 3 秒換一顆（大圖／實際游標大小）</h2><div class="grid" id="g"></div>
<h2>滑到能點的東西上 → 葡萄柚；點下去 → 切開</h2><div class="split" id="s"></div>
<script>
var A=window.SG_CURSOR_ART,g=document.getElementById('g');
A.planets.forEach(function(p){g.insertAdjacentHTML('beforeend','<div class="cell"><div class="row"><span class="big">'+p[1]+'</span><span class="small">'+p[1]+'</span></div><span>'+p[0]+'</span></div>')});
g.insertAdjacentHTML('beforeend','<div class="cell"><div class="row"><span class="big">'+A.whole+'</span><span class="small">'+A.whole+'</span></div><span>葡萄柚（可以點）</span></div>');
var s=document.getElementById('s');
s.innerHTML='<div>'+A.whole+'</div><span>→</span><div class="h" style="clip-path:inset(0 50% 0 0);transform:translate(-14px,6px) rotate(-18deg)">'+A.half+'</div><div class="h" style="clip-path:inset(0 0 0 50%);transform:translate(-80px,6px) rotate(18deg)">'+A.half+'</div><div>'+A.half+'</div><span>（右邊是切開的剖面）</span>';
</script></body></html>
